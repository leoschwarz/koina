name: Build CPU Docker image (fork)

# Fork-only image build. The upstream release_docker.yml runs on wilhelm-lab's
# self-hosted GPU runners and only on a merged labeled PR; a fork can't use those.
# Building the image needs no GPU (only running GPU inference does), so this builds
# the `serving-prod` target on a standard GitHub-hosted runner and publishes to the
# fork's GHCR. Model weights are .dockerignored, so the image carries only configs +
# the .zenodo pointers; the CPU models are downloaded at container startup.

on:
  push:
    branches:
      - feature/prosit-2019-cpu-reexport
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space (Triton base image is large)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the CPU serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: serving-prod
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu-${{ github.sha }}

      - name: Summary
        run: |
          echo "### Built CPU image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Run on a CPU-only host (no --gpus), e.g.:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker run --rm --shm-size 8G -e KOINA_FORCE_CPU=1 \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -e MODEL_PATTERN=Prosit_2019_intensity -p 8500-8502:8500-8502 \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
